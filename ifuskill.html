// ═══════════════════════════════════════════════════
// SALARY INTELLIGENCE
// ═══════════════════════════════════════════════════
function SalaryIntelligence({ searches }) {
  const positions = [...new Set(searches.map(s=>s.position))];
  const stats = positions.map(pos => {
    const posSearches = searches.filter(s=>s.position===pos);
    const cands = posSearches.flatMap(s=>s.candidates.filter(c=>c.expectedSalary>0));
    const sals = cands.map(c=>Number(c.expectedSalary));
    // aggregate all benefits across searches of same position, deduplicated
    const allBenefits = [...new Set(posSearches.flatMap(s=>s.benefits||[]))];
    return { position:pos, count:cands.length, avg:sals.length?Math.round(sals.reduce((a,b)=>a+b,0)/sals.length):null, min:sals.length?Math.min(...sals):null, max:sals.length?Math.max(...sals):null, benefits:allBenefits };
  }).filter(p=>p.count>0).sort((a,b)=>(b.avg||0)-(a.avg||0));

  return (
    <div>
      <div style={{marginBottom:24}}>
        <div className="section-label">Inteligencia salarial</div>
        <div className="section-title">Base de datos de mercado</div>
        <div className="section-subtitle">Se construye automáticamente con cada candidato cargado al sistema</div>
      </div>
      {!stats.length ? (
        <div className="empty-state"><div className="empty-icon">💰</div><div className="empty-title">Sin datos salariales aún</div><div className="empty-desc">A medida que cargues candidatos con remuneración pretendida, esta sección se irá construyendo sola.</div></div>
      ) : (
        <div>
          <div className="dark-card" style={{marginBottom:20}}>
            <div className="dark-card-title">Mercado consolidado – {searches.flatMap(s=>s.candidates).filter(c=>c.expectedSalary>0).length} datos relevados</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:16}}>
              {[
                {label:'Posiciones relevadas',val:stats.length},
                {label:'Salario mínimo registrado',val:`$${Math.min(...stats.map(s=>s.min||Infinity)).toLocaleString()}`},
                {label:'Salario máximo registrado',val:`$${Math.max(...stats.map(s=>s.max||0)).toLocaleString()}`},
                {label:'Promedio general',val:`$${Math.round(stats.reduce((a,s)=>a+(s.avg||0),0)/stats.length).toLocaleString()}`},
              ].map(m=>(
                <div key={m.label} style={{background:'rgba(255,255,255,0.06)',borderRadius:10,padding:'16px'}}>
                  <div style={{fontSize:22,fontWeight:800,color:'var(--green)'}}>{m.val}</div>
                  <div style={{fontSize:10,color:'rgba(255,255,255,0.45)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.5px',marginTop:4}}>{m.label}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="card">
            <div className="card-title" style={{marginBottom:18}}>Promedios salariales por posición (USD bruto mensual)</div>
            {stats.map(p=>(
              <div key={p.position} className="salary-row" style={{flexDirection:'column',alignItems:'flex-start',gap:8}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',width:'100%'}}>
                  <div>
                    <div className="salary-pos">{p.position}</div>
                    <div className="salary-range">{p.count} candidato{p.count!==1?'s':''} relevado{p.count!==1?'s':''} · Rango: ${p.min?.toLocaleString()} – ${p.max?.toLocaleString()}</div>
                  </div>
                  <div className="salary-avg" style={{flexShrink:0,marginLeft:16}}>${p.avg?.toLocaleString()}<span style={{fontSize:12,color:'var(--text-muted)',fontWeight:500}}>/mes</span></div>
                </div>
                {p.benefits && p.benefits.length>0 && (
                  <div style={{display:'flex',flexWrap:'wrap',gap:6,paddingBottom:4}}>
                    <span style={{fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'0.5px',color:'var(--text-light)',alignSelf:'center',marginRight:2}}>Beneficios:</span>
                    {p.benefits.map(b=>(
                      <span key={b} style={{padding:'2px 10px',background:'var(--green-light)',color:'var(--green-dark)',borderRadius:12,fontSize:11,fontWeight:700,border:'1px solid var(--green-mid)'}}>✓ {b}</span>
                    ))}
                  </div>
                )}
              </div>
            ))}
            <p className="help-text" style={{marginTop:12}}>⚡ Datos actualizados en tiempo real con cada candidato cargado.</p>
          </div>
        </div>
      )}
    </div>
  );
}

// GLOBAL METRICS
// ═══════════════════════════════════════════════════
function GlobalMetrics({ searches, users }) {
  const allC = searches.flatMap(s=>s.candidates);
  const total = allC.length;
  const presented = allC.filter(c=>c.status==='Presentado').length;
  const recruiters = users.filter(u=>u.role==='recruiter');

  const statusData = STATUSES.map(s=>allC.filter(c=>c.status===s).length);
  const statusColors = STATUSES.map(s=>STATUS_COLORS[s]);
  const gList = ['Masculino','Femenino','No binario'];
  const gData = gList.map(g=>allC.filter(c=>c.gender===g).length).filter(n=>n>0);
  const gLabels = gList.filter(g=>allC.some(c=>c.gender===g));

  const rStats = recruiters.map(r => ({ name:r.name, searches:searches.filter(s=>s.recruiter===r.id).length, candidates:searches.filter(s=>s.recruiter===r.id).flatMap(s=>s.candidates).length, presented:searches.filter(s=>s.recruiter===r.id).flatMap(s=>s.candidates).filter(c=>c.status==='Presentado').length }));

  return (
    <div>
      <div style={{marginBottom:24}}>
        <div className="section-label">Métricas globales</div>
        <div className="section-title">Vista consolidada</div>
        <div className="section-subtitle">Toda la actividad del equipo en un vistazo</div>
      </div>

      <div className="metrics-grid">
        <div className="metric-card"><div className="metric-value">{searches.length}</div><div className="metric-label">Total búsquedas</div><div className="metric-sub">{searches.filter(s=>s.status==='Activa').length} activas</div></div>
        <div className="metric-card"><div className="metric-value">{total}</div><div className="metric-label">Total candidatos</div></div>
        <div className="metric-card"><div className="metric-value green">{presented}</div><div className="metric-label">Presentados</div><div className="metric-sub">{total?Math.round(presented/total*100):0}% conversión</div></div>
        <div className="metric-card"><div className="metric-value">{recruiters.length}</div><div className="metric-label">Reclutadoras</div></div>
      </div>

      {total>0&&(
        <div className="charts-grid" style={{marginBottom:24}}>
          {statusData.some(d=>d>0)&&<DonutChart data={statusData.filter((_,i)=>statusData[i]>0)} labels={STATUSES.filter((_,i)=>statusData[i]>0)} colors={statusColors.filter((_,i)=>statusData[i]>0)} title="CANDIDATOS POR ESTADO (GLOBAL)"/>}
          {gData.length>0&&<DonutChart data={gData} labels={gLabels} colors={['#3B82F6','#EC4899','#8B5CF6']} title="DISTRIBUCIÓN POR GÉNERO (GLOBAL)"/>}
        </div>
      )}

      {rStats.length>0&&(
        <div className="card">
          <div className="card-title" style={{marginBottom:16}}>Actividad por reclutadora</div>
          <div className="table-wrapper">
            <table>
              <thead><tr><th>Reclutadora</th><th>Búsquedas</th><th>Candidatos cargados</th><th>Presentados</th><th>% Conversión</th></tr></thead>
              <tbody>
                {rStats.map(r=>(
                  <tr key={r.name}>
                    <td style={{fontWeight:700}}>{r.name}</td>
                    <td>{r.searches}</td>
                    <td>{r.candidates}</td>
                    <td style={{color:'var(--green-dark)',fontWeight:700}}>{r.presented}</td>
                    <td>{r.candidates?Math.round(r.presented/r.candidates*100):0}%</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

function RecruiterFormModal({ recruiter, onSave, onClose }) {
  const isEdit = !!recruiter?.id;
  const [form, setForm] = useState(recruiter ? { ...recruiter, password:'' } : { name:'', email:'', password:'', role:'recruiter' });
  const [error, setError] = useState('');
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const handleSubmit = () => {
    if (!form.name.trim()) { setError('El nombre es obligatorio.'); return; }
    if (!form.email.trim()) { setError('El email es obligatorio.'); return; }
    if (!isEdit && !form.password.trim()) { setError('La contraseña es obligatoria para nuevas reclutadoras.'); return; }
    const saved = {
      ...form,
      id: form.id || uid(),
      initials: getInitials(form.name),
      role: 'recruiter',
    };
    if (isEdit && !form.password.trim()) delete saved.password; // keep existing password
    onSave(saved);
  };

  return (
    <div className="modal-overlay" style={{zIndex:1100}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:480}}>
        <div className="modal-header">
          <div className="modal-title">{isEdit?'✏️ Editar reclutadora':'➕ Nueva reclutadora'}</div>
          <button className="icon-btn" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          {error&&<div className="alert alert-error">{error}</div>}
          <div className="form-group">
            <label className="form-label required">Nombre completo</label>
            <input className="form-input" value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Ej: Lucía González" autoFocus/>
          </div>
          <div className="form-group">
            <label className="form-label required">Email</label>
            <input className="form-input" type="email" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="lucia@ifuskill.com"/>
          </div>
          <div className="form-group">
            <label className="form-label" style={{textTransform:'uppercase',letterSpacing:'0.5px',fontSize:12,fontWeight:700}}>
              {isEdit ? 'Nueva contraseña' : 'Contraseña'}{!isEdit&&<span style={{color:'var(--red)'}}> *</span>}
            </label>
            <input className="form-input" type="password" value={form.password} onChange={e=>set('password',e.target.value)} placeholder={isEdit?'Dejá vacío para no cambiar':'••••••••'}/>
            {isEdit&&<p className="help-text">Si dejás vacío, se mantiene la contraseña actual.</p>}
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={handleSubmit}>{isEdit?'💾 Guardar cambios':'➕ Agregar reclutadora'}</button>
        </div>
      </div>
    </div>
  );
}

            <span style={{fontSize:13,color:'var(--text-muted)',fontWeight:500}}>{recruiters.length} reclutadora{recruiters.length!==1?'s':''} en el equipo</span>
            <button className="btn btn-primary btn-sm" onClick={openNew}>➕ Nueva reclutadora</button>
          </div>

          {!recruiters.length ? (
            <div className="empty-state" style={{padding:'36px 16px'}}>
              <div className="empty-icon">👤</div>
              <div className="empty-title">Sin reclutadoras</div>
              <div className="empty-desc">Agregá la primera reclutadora al equipo.</div>
            </div>
          ) : (
            <div className="table-wrapper">
              <table>
                <thead>
                  <tr><th>Reclutadora</th><th>Email</th><th>Búsquedas</th><th>Candidatos</th><th>Presentados</th><th>Acciones</th></tr>
                </thead>
                <tbody>
                  {recruiters.map(r => {
                    const rSearches = searches.filter(s=>s.recruiter===r.id);
                    const rCands    = rSearches.flatMap(s=>s.candidates);
                    return (
                      <tr key={r.id}>
                        <td>
                          <div style={{display:'flex',alignItems:'center',gap:10}}>
                            <div className="user-avatar green" style={{width:34,height:34,fontSize:13,flexShrink:0}}>{r.initials}</div>
                            <span style={{fontWeight:700}}>{r.name}</span>
                          </div>
                        </td>
                        <td style={{fontSize:12,color:'var(--text-muted)',fontWeight:500}}>{r.email}</td>
                        <td style={{fontWeight:700,textAlign:'center'}}>{rSearches.length}</td>
                        <td style={{fontWeight:700,textAlign:'center'}}>{rCands.length}</td>
                        <td style={{fontWeight:700,color:'var(--green-dark)',textAlign:'center'}}>{rCands.filter(c=>c.status==='Presentado').length}</td>
                        <td>
                          <button className="icon-btn" title="Editar" onClick={()=>openEdit(r)}>✏️</button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
          <p className="help-text" style={{marginTop:14}}>💡 Los datos se guardan localmente. En producción, conectar con un sistema de autenticación seguro.</p>
        </div>
        <div className="modal-footer">
          <button className="btn btn-secondary" onClick={onClose}>Cerrar</button>
        </div>
      </div>

      {showForm&&(
        <RecruiterFormModal
          recruiter={editingR}
          onSave={handleSave}
          onClose={()=>{setShowForm(false);setEditingR(null);}}
        />
      )}
    </div>
  );
}

// DASHBOARD
// ═══════════════════════════════════════════════════
function Dashboard({ searches, users, currentUser, onSelectSearch, onCreateSearch, onManageTeam, onImport, onDeleteSearch, candidateDB, onCandidateAdd, onCandidateEdit, onCandidateDelete }) {
  const [tab, setTab] = useState('activas');
  const [filterRec, setFilterRec] = useState('');
  const [filterClient, setFilterClient] = useState('');
  const [showNewSearch, setShowNewSearch] = useState(false);

  const mySearches = currentUser.role==='admin' ? searches : searches.filter(s=>s.recruiter===currentUser.id);
  const activeS = mySearches.filter(s=>s.status==='Activa'||s.status==='Abierta');
  const closedS = mySearches.filter(s=>s.status==='Cerrada');
  const pausedS = mySearches.filter(s=>s.status==='Pausada');
  const recruiters = users.filter(u=>u.role==='recruiter');

  const applyF = list => list.filter(s => (!filterRec||s.recruiter===filterRec) && (!filterClient||s.client.toLowerCase().includes(filterClient.toLowerCase())));

  const badgeClass = s => 'badge badge-'+(s==='Exámenes'?'examenes':s.toLowerCase());

  const SearchCard = ({ search }) => {
    const rec = users.find(u=>u.id===search.recruiter);
    return (
      <div className="search-card" style={{position:'relative'}} onClick={()=>onSelectSearch(search)}>
        {currentUser.role==='admin' && (
          <button
            title="Eliminar búsqueda"
            onClick={e=>{
              e.stopPropagation();
              if(confirm(`¿Eliminár "${search.position}" de ${search.client||'sin cliente'}? Esta acción no se puede deshacer.`))
                onDeleteSearch(search.id);
            }}
            style={{position:'absolute',top:10,right:10,background:'none',border:'none',cursor:'pointer',fontSize:15,color:'var(--text-muted)',padding:4,borderRadius:6,lineHeight:1,zIndex:2}}
            onMouseOver={e=>e.currentTarget.style.color='var(--red)'}
            onMouseOut={e=>e.currentTarget.style.color='var(--text-muted)'}
          >🗑️</button>
        )}
        <div className="search-card-client">{search.client}</div>
        <div className="search-card-position">{search.position}</div>
        <div className="search-card-stats">
          <div className="stat-item"><div className="stat-value">{search.candidates.length}</div><div className="stat-label">Candidatos</div></div>
          <div className="stat-item"><div className="stat-value" style={{color:'var(--green-dark)'}}>{search.candidates.filter(c=>c.status==='Presentado').length}</div><div className="stat-label">Presentados</div></div>
          <div className="stat-item"><div className="stat-value" style={{color:'var(--red)'}}>{search.candidates.filter(c=>c.status==='Rechazado').length}</div><div className="stat-label">Rechazados</div></div>
        </div>
        <div className="search-card-footer">
          <span className="recruiter-tag">👩‍💻 {rec?.name||'—'}</span>
          <span className={badgeClass(search.status)}>{search.status}</span>
        </div>
      </div>
    );
  };

  const renderList = (list) => {
    const f = applyF(list);
    if (!f.length) return (
      <div className="empty-state">
        <div className="empty-icon">{tab==='activas'?'🔍':'📁'}</div>
        <div className="empty-title">Sin búsquedas {tab==='activas'?'activas':tab==='pausadas'?'pausadas':'cerradas'}</div>
        <div className="empty-desc">{currentUser.role==='admin'?'Creá una nueva búsqueda para empezar.':'No tenés búsquedas asignadas aún.'}</div>
        {currentUser.role==='admin'&&tab==='activas'&&<button className="btn btn-primary" onClick={()=>setShowNewSearch(true)}>✨ Nueva búsqueda</button>}
      </div>
    );
    return <div className="searches-grid">{f.map(s=><SearchCard key={s.id} search={s}/>)}</div>;
  };

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:24,gap:16,flexWrap:'wrap'}}>
        <div>
          <div className="section-label">{currentUser.role==='admin'?'Panel de control':'Mi panel'}</div>
          <div className="section-title">{currentUser.role==='admin'?'Dashboard general':`Hola, ${currentUser.name.split(' ')[0]} 👋`}</div>
          <div className="section-subtitle">{currentUser.role==='admin'?'Vista completa de todas las búsquedas':'Tus búsquedas activas y candidatos'}</div>
        </div>
        {currentUser.role==='admin'&&(
          <div style={{display:'flex',gap:10}}>
            <button className="btn btn-secondary" onClick={onManageTeam}>👩‍💻 Gestionar equipo</button>
                {onImport&&<button className="btn btn-secondary" onClick={onImport}>📥 Importar búsquedas</button>}
            <button className="btn btn-primary btn-lg" onClick={()=>setShowNewSearch(true)}>✨ Nueva búsqueda</button>
          </div>
        )}
      </div>

      <div className="filters-bar">
        <input className="filter-input" placeholder="🏢 Buscar por cliente..." value={filterClient} onChange={e=>setFilterClient(e.target.value)}/>
        {currentUser.role==='admin'&&(
          <select className="filter-input form-select" value={filterRec} onChange={e=>setFilterRec(e.target.value)}>
            <option value="">Todas las reclutadoras</option>
            {recruiters.map(r=><option key={r.id} value={r.id}>{r.name}</option>)}
          </select>
        )}
      </div>

      <div className="tabs">
        <div className={`tab ${tab==='activas'?'active':''}`} onClick={()=>setTab('activas')}>🟢 Abiertas <span className="tab-badge">{applyF(activeS).length}</span></div>
        <div className={`tab ${tab==='cerradas'?'active':''}`} onClick={()=>setTab('cerradas')}>📁 Cerradas <span className="tab-badge">{applyF(closedS).length}</span></div>
        <div className={`tab ${tab==='pausadas'?'active':''}`} onClick={()=>setTab('pausadas')}>⏸️ Pausadas <span className="tab-badge">{pausedS.length}</span></div>
        {currentUser.role==='admin'&&<div className={`tab ${tab==='metricas'?'active':''}`} onClick={()=>setTab('metricas')}>📈 Métricas globales</div>}
        {currentUser.role==='admin'&&<div className={`tab ${tab==='salarios'?'active':''}`} onClick={()=>setTab('salarios')}>🧠 Intel. salarial</div>}
        {currentUser.role==='admin'&&<div className={`tab ${tab==='base'?'active':''}`} onClick={()=>setTab('base')}>🗂️ Base de candidatos</div>}
      </div>

      {tab==='activas'&&renderList(activeS)}
      {tab==='cerradas'&&renderList(closedS)}
       {tab==='pausadas'&&renderList(pausedS)}
      {tab==='metricas'&&<GlobalMetrics searches={mySearches} users={users}/>}
      {tab==='salarios'&&<SalaryIntelligence searches={mySearches}/>}
      {tab==='base'&&<CandidateDB candidateDB={candidateDB||[]} onAdd={onCandidateAdd} onEdit={onCandidateEdit} onDelete={onCandidateDelete}/>}

      {showNewSearch&&<NewSearchModal users={users} onSave={d=>{onCreateSearch(d);setShowNewSearch(false);}} onClose={()=>setShowNewSearch(false)}/>}
    </div>
  );
}

// ═══════════════════════════════════════════════════
// APP ROOT
// ═══════════════════════════════════════════════════
function App() {
  const [searches, setSearches] = useState(() => load('ifs_searches', DEMO_SEARCHES));
  const [users, setUsers] = useState(() => load('ifs_users', DEMO_USERS));
  const [importOpen, setImportOpen] = React.useState(false);
  const [candidateDB, setCandidateDB] = useState(()=>load('ifs_candidateDB',[]));
  const [currentUser, setCurrentUser] = useState(() => load('ifs_user', null));
  const [selectedSearch, setSelectedSearch] = useState(null);
  const [showTeam, setShowTeam] = useState(false);
  const [cloudStatus, setCloudStatus] = useState('idle'); // 'idle' | 'syncing' | 'ok' | 'error'

  // ── Al abrir la app: cargar datos desde Supabase (fuente de verdad) ──
  useEffect(() => {
    const loadFromCloud = async () => {
      setCloudStatus('syncing');
      try {
        const [{ data: sData, error: sErr }, { data: uData, error: uErr }, { data: cData, error: cErr }] = await Promise.all([
          db.from('ifs_searches').select('id, data').order('updated_at', { ascending: false }),
          db.from('ifs_app_users').select('id, data'),
          db.from('ifs_candidate_db').select('data').eq('id','global'),
        ]);
        // Detectar errores de tablas faltantes
        if (sErr) { console.error('Supabase ifs_searches error:', sErr.message); setCloudStatus('error'); setTimeout(()=>setCloudStatus('idle'),5000); return; }
        if (uErr) { console.error('Supabase ifs_app_users error:', uErr.message); setCloudStatus('error'); setTimeout(()=>setCloudStatus('idle'),5000); return; }

        if (sData) {
          if (sData.length > 0) {
            const loaded = sData.map(r => r.data);
            setSearches(loaded);
            save('ifs_searches', loaded);
          } else {
            // Primera vez: subir datos locales a Supabase
            const localS = load('ifs_searches', DEMO_SEARCHES);
            await Promise.all(localS.map(s =>
              db.from('ifs_searches').upsert({ id: s.id, data: s, updated_at: new Date().toISOString() }, { onConflict: 'id' })
            ));
          }
        }
        if (uData) {
          if (uData.length > 0) {
            const loaded = uData.map(r => r.data);
            setUsers(loaded);
            save('ifs_users', loaded);
          } else {
            const localU = load('ifs_users', DEMO_USERS);
            await Promise.all(localU.map(u =>
              db.from('ifs_app_users').upsert({ id: u.id, data: u }, { onConflict: 'id' })
            ));
          }
        }
        if (!cErr && cData && cData.length > 0) {
          const loaded = cData[0].data || [];
          setCandidateDB(loaded);
          save('ifs_candidateDB', loaded);
        }
        setCloudStatus('ok');
      } catch(e) {
        console.warn('No se pudo conectar a Supabase, usando datos locales:', e);
        setCloudStatus('error');
      }
      setTimeout(() => setCloudStatus('idle'), 3000);
    };
    loadFromCloud();
  }, []);

  // ── localStorage como caché local ──
  useEffect(() => { save('ifs_searches', searches); }, [searches]);
  useEffect(() => { save('ifs_users', users); }, [users]);
  useEffect(() => { save('ifs_user', currentUser); }, [currentUser]);
  useEffect(() => {
    save('ifs_candidateDB', candidateDB);
    // Sync candidateDB to Supabase con debounce
    const t = setTimeout(() => {
      db.from('ifs_candidate_db').upsert({ id: 'global', data: candidateDB, updated_at: new Date().toISOString() }, { onConflict: 'id' })
        .then(({ error }) => { if (error) console.warn('CandidateDB sync error:', error.message); });
    }, 1500);
    return () => clearTimeout(t);
  }, [candidateDB]);

  // ── Helpers de sync a Supabase ──
  const pushSearch = async (s) => {
    try { await db.from('ifs_searches').upsert({ id: s.id, data: s, updated_at: new Date().toISOString() }, { onConflict: 'id' }); }
    catch(e) { console.warn('Search sync error:', e); }
  };
  const pushUser = async (u) => {
    try { await db.from('ifs_app_users').upsert({ id: u.id, data: u }, { onConflict: 'id' }); }
    catch(e) { console.warn('User sync error:', e); }
  };
  const deleteSearch = async (id) => {
    try { await db.from('ifs_searches').delete().eq('id', id); }
    catch(e) { console.warn('Search delete error:', e); }
  };

  const handleAddCandidate=c=>setCandidateDB(prev=>[...prev,c]);
  const handleEditCandidate=c=>setCandidateDB(prev=>prev.map(x=>x.id===c.id?c:x));
  const handleDeleteCandidate=id=>setCandidateDB(prev=>prev.filter(x=>x.id!==id));
  const handleDeleteSearch = (id) => {
    setSearches(prev => prev.filter(s => s.id !== id));
    if (selectedSearch?.id === id) setSelectedSearch(null);
    deleteSearch(id);
  };
  const handleUpdateSearch = (updated) => {
    setSearches(prev => prev.map(s=>s.id===updated.id?updated:s));
    if (selectedSearch?.id===updated.id) setSelectedSearch(updated);
    pushSearch(updated);
  };

  const handleSaveRecruiter = (data) => {
    setUsers(prev => {
      const idx = prev.findIndex(u=>u.id===data.id);
      let next;
      if (idx>=0) {
        const merged = { ...prev[idx], ...data };
        if (!data.password) merged.password = prev[idx].password;
        next = prev.map(u=>u.id===data.id?merged:u);
      } else {
        next = [...prev, data];
      }
      pushUser(next.find(u=>u.id===data.id));
      return next;
    });
  };

  const handleCreateSearch = (d) => {
    setSearches(prev=>[...prev, d]);
    pushSearch(d);
  };

  const handleLogout = () => { setCurrentUser(null); setSelectedSearch(null); save('ifs_user', null); };

  if (!currentUser) return <LoginPage users={users} onLogin={setCurrentUser}/>;

  const liveSearch = selectedSearch ? searches.find(s=>s.id===selectedSearch.id)||selectedSearch : null;

  return (
    <div className="app-layout">
      <Header user={currentUser} onLogout={handleLogout}/>
      {/* Indicador de sync en la nube */}
      {cloudStatus !== 'idle' && (
        <div style={{position:'fixed',bottom:20,right:20,zIndex:9999,padding:'8px 14px',borderRadius:20,fontSize:12,fontWeight:700,display:'flex',alignItems:'center',gap:7,boxShadow:'0 4px 16px rgba(0,0,0,0.15)',
          background: cloudStatus==='ok' ? 'var(--green-dark)' : cloudStatus==='error' ? '#EF4444' : 'var(--dark-2)',
          color: 'white'}}>
          {cloudStatus==='syncing' && <div style={{width:11,height:11,border:'2px solid rgba(255,255,255,0.4)',borderTopColor:'white',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/>}
          {cloudStatus==='ok' && '☁️'}
          {cloudStatus==='error' && '⚠️'}
          {cloudStatus==='syncing' ? 'Sincronizando...' : cloudStatus==='ok' ? 'Datos sincronizados' : 'Sin conexión — datos locales'}
        </div>
      )}
      <div className="main-content">
        {liveSearch ? (
          <SearchDetail
            search={liveSearch}
            users={users}
            currentUser={currentUser}
            onBack={()=>setSelectedSearch(null)}
            onUpdateSearch={handleUpdateSearch}
            onDeleteSearch={handleDeleteSearch}
            candidateDB={candidateDB}
          />
        ) : (
          <Dashboard
            searches={searches}
            users={users}
            currentUser={currentUser}
            onSelectSearch={setSelectedSearch}
            onCreateSearch={handleCreateSearch}
            onManageTeam={()=>setShowTeam(true)}
            onImport={()=>setImportOpen(true)}
            onDeleteSearch={handleDeleteSearch}
            candidateDB={candidateDB}
            onCandidateAdd={handleAddCandidate}
            onCandidateEdit={handleEditCandidate}
            onCandidateDelete={handleDeleteCandidate}
          />
        )}
      </div>

      {showTeam && (
        <RecruiterManager
          users={users}
          searches={searches}
          onSaveRecruiter={handleSaveRecruiter}
          onClose={()=>setShowTeam(false)}
        />
      )}
      {importOpen&&<ImportModal onClose={()=>setImportOpen(false)} onImport={async(data)=>{
        if(data.isRealFormat){
          const u=()=>Math.random().toString(36).slice(2);
          const allNewS=data.searches.map(s=>({id:u(),name:s._name,position:s._name,client:'',status:'Abierta',description:'',modality:'',location:'',expectedSalary:'',recruiter:'',createdAt:new Date().toISOString().slice(0,10),candidates:s._cands.map(c=>({id:u(),name:c.candidateName||'',lastName:c.candidateLastName||'',email:c.candidateEmail||'',phone:c.candidatePhone||'',position:s._name,status:c.candidateStatus||'Contacto',expectedSalary:c.expectedSalaryCandidate||'',notes:c.notes||'',linkedin:c.linkedin||'',area:'Otro',currentCompany:'',currentSalary:'',cvFileName:'',createdAt:new Date().toISOString().slice(0,10)}))}));
          setSearches(prev=>[...prev,...allNewS]);
          // Push cada búsqueda importada a Supabase
          allNewS.forEach(s => pushSearch(s));
          const dbC=data.candidates.map(c=>({id:u(),name:c.candidateName||'',lastName:c.candidateLastName||'',email:c.candidateEmail||'',phone:c.candidatePhone||'',position:c._sheet||'',status:c.candidateStatus||'',expectedSalary:c.expectedSalaryCandidate||'',notes:c.notes||'',linkedin:c.linkedin||'',area:'Otro',currentCompany:'',currentSalary:'',cvFileName:'',createdAt:new Date().toISOString().slice(0,10)}));
          setCandidateDB(prev=>[...prev,...dbC]);
          alert(allNewS.length+' búsquedas y '+dbC.length+' candidatos importados correctamente');
          return;
        }
        const newC=data.filter(d=>d.candidateName||d.candidateEmail).map(d=>({id:uid(),name:d.candidateName||'',lastName:d.candidateLastName||'',email:d.candidateEmail||'',phone:d.candidatePhone||'',position:d.candidatePosition||d.position||'',area:CANDIDATE_AREAS.includes(d.candidateArea)?d.candidateArea:'Otro',currentCompany:d.currentCompany||'',currentSalary:d.currentSalary||'',expectedSalary:d.expectedSalaryCandidate||'',linkedin:d.linkedin||'',notes:d.notes||'',cvFileName:'',createdAt:new Date().toISOString().slice(0,10)}));
        if(newC.length>0) setCandidateDB(prev=>[...prev,...newC]);
        const newS=data.filter(d=>d.name).map(d=>({
          id:uid(),name:d.name||'',position:d.position||d.name||'',
          client:d.client||'',status:SEARCH_STATUSES.includes(d.status)?d.status:'Abierta',
          description:d.description||'',modality:d.modality||'',location:d.location||'',
          expectedSalary:d.expectedSalary||'',
          createdAt:d.createdAt||new Date().toISOString().slice(0,10),candidates:[]
        }));
        setSearches(prev=>[...prev,...newS]);
        // Push búsquedas importadas (formato genérico) a Supabase
        newS.forEach(s => pushSearch(s));
        setImportOpen(false);
      }}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
